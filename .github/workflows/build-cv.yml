name: Build CV

on:
  push:
    paths:
      - 'cv/cv_data.yaml'
      - 'cv/cv_template.typ'
      - 'cv/generate_cv.py'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate Typst from YAML
        run: python cv/generate_cv.py cv/cv_data.yaml cv/Lade_CV.typ

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Compile Typst to PDF
        run: |
          cd cv
          typst compile Lade_CV.typ Lade_CV.pdf

      - name: Commit and push PDF
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cv/Lade_CV.pdf cv/Lade_CV.typ
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-build CV PDF [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN (and [skip ci]) never trigger deploy.yml,
      # so the live site would keep serving the old PDF. Dispatch it explicitly.
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
